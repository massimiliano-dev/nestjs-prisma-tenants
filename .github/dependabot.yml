version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript up to 6.0
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # types must match the minimum supported Node (22)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Prisma majors change the config and client API: upgrade deliberately.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
